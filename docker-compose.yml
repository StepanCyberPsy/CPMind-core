name: cpmind-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cpmind
      POSTGRES_USER: cpmind
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cpmind"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_dev_data: