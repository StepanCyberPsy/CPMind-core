<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 728px;
      height: 90px;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
    }

    .banner {
      width: 728px;
      height: 90px;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 60%, #1d4ed8 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px 0 24px;
      position: relative;
      overflow: hidden;
      transition: filter 0.2s;
    }

    .banner:hover {
      filter: brightness(1.06);
    }

    /* Декоративный элемент */
    .banner::before {
      content: '';
      position: absolute;
      right: 200px;
      top: -30px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: rgba(59, 130, 246, 0.15);
      pointer-events: none;
    }

    .banner::after {
      content: '';
      position: absolute;
      right: 160px;
      bottom: -40px;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: rgba(99, 179, 237, 0.1);
      pointer-events: none;
    }

    .left {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .logo-mark {
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.12);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-mark svg {
      width: 20px;
      height: 20px;
    }

    .brand {
      font-family: -apple-system, 'Segoe UI', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.3px;
      line-height: 1;
      margin-bottom: 3px;
    }

    .tagline {
      font-family: -apple-system, 'Segoe UI', sans-serif;
      font-size: 11px;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.02em;
    }

    .middle {
      flex: 1;
      padding: 0 24px;
    }

    .headline {
      font-family: -apple-system, 'Segoe UI', sans-serif;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .sub {
      font-family: -apple-system, 'Segoe UI', sans-serif;
      font-size: 12px;
      color: rgba(255,255,255,0.5);
    }

    .cta {
      flex-shrink: 0;
      background: #ffffff;
      color: #1d4ed8;
      font-family: -apple-system, 'Segoe UI', sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 22px;
      border-radius: 6px;
      white-space: nowrap;
      letter-spacing: -0.1px;
      transition: background 0.15s;
    }

    .banner:hover .cta {
      background: #f0f9ff;
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="left">
      <div class="logo-mark">
        <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 2L17 6V14L10 18L3 14V6L10 2Z"
                stroke="rgba(255,255,255,0.9)" stroke-width="1.5"
                fill="rgba(255,255,255,0.08)"/>
          <circle cx="10" cy="10" r="2.5" fill="rgba(255,255,255,0.8)"/>
        </svg>
      </div>
      <div class="text-block">
        <div class="brand">CPMind</div>
        <div class="tagline">Ad Intelligence</div>
      </div>
    </div>

    <div class="middle">
      <div class="headline">Измеряйте реальное внимание к рекламе</div>
      <div class="sub">Поведенческие сигналы · CPMind Score · Аналитика показов</div>
    </div>

    <div class="cta">Узнать больше</div>
  </div>
</body>
</html>
