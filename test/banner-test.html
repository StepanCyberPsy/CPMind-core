<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPMind — Тестовая страница</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }
    .spacer { height: 600px; background: #f5f5f5; display: flex;
              align-items: center; justify-content: center; color: #999; }
    .banner-container { display: flex; justify-content: center;
                        margin: 40px 0; }
  </style>
</head>
<body>
  <h1>Тестовая страница CPMind</h1>
  <p>Скрольте вниз, чтобы увидеть баннер.</p>

  <div class="spacer">↓ Скрольте вниз ↓</div>
  <div class="banner-container">
    <div
      data-cpmind-creative
      data-campaign-id="demo_campaign_01"
      data-creative-id="banner_728x90_static"
      data-creative-type="banner_static"
      data-endpoint="http://localhost:3001/api/impressions"
      style="width: 728px; height: 90px;"
    >
      <a href="https://cpmind.io" id="banner-link" target="_blank"
         style="display:block;width:100%;height:100%;">
        <img src="banner-placeholder.html"
             width="728" height="90"
             alt="CPMind Test Banner"
             style="display:block;border:1px solid #ccc;">
      </a>
    </div>
  </div>

  <div class="spacer">Контент после баннера</div>
  <div class="spacer">Еще контент...</div>
  
  <script async src="../packages/tag/dist/cpmind-tag.min.js"></script>
</body>
</html>
