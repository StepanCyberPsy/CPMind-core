services:

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - tag_dist:/etc/nginx/tag:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      runtime-publisher:
        condition: service_completed_successfully
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    restart: always
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://cpmind:${DB_PASSWORD}@postgres:5432/cpmind
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      ADMIN_LOGIN: ${ADMIN_LOGIN}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      CALIBRATION_DRAFT_TTL_MINUTES: ${CALIBRATION_DRAFT_TTL_MINUTES:-60}
      AD_SESSION_TTL_HOURS: ${AD_SESSION_TTL_HOURS:-24}
      TAG_DIST_DIR: /tag_dist
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: "3001"
      HOST: "0.0.0.0"
      YC_SIGNER_KEY_ID: ${YC_SIGNER_KEY_ID}
      YC_SIGNER_SECRET: ${YC_SIGNER_SECRET}
      STAGING_BUCKET: ${STAGING_BUCKET}
      SOURCE_BUCKET: ${SOURCE_BUCKET}
      DELIVERY_BUCKET: ${DELIVERY_BUCKET}
      CDN_BASE_URL: ${CDN_BASE_URL}
      DELIVERY_BASE_URL: ${DELIVERY_BASE_URL}
      CREATIVE_BASE_URL: ${CREATIVE_BASE_URL}
      COLLECT_ENDPOINT: ${COLLECT_ENDPOINT}
      LOADER_RUNTIME_VERSION: ${LOADER_RUNTIME_VERSION:-1}
      DISPLAY_RUNTIME_VERSION: ${DISPLAY_RUNTIME_VERSION:-1}
      PLAYER_RUNTIME_VERSION: ${PLAYER_RUNTIME_VERSION:-1}
      BACKEND_DB_POOL_MAX: ${BACKEND_DB_POOL_MAX:-20}
      BACKEND_DB_IDLE_TIMEOUT_MS: ${BACKEND_DB_IDLE_TIMEOUT_MS:-30000}
      BACKEND_DB_CONNECTION_TIMEOUT_MS: ${BACKEND_DB_CONNECTION_TIMEOUT_MS:-2000}
    volumes:
      - tag_dist:/tag_dist
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "async function h(){try{const r=await fetch('http://localhost:3001/api/health');process.exit(r.ok?0:1)}catch{process.exit(1)}}h()"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ""
    restart: always
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:3001
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "async function h(){try{const r=await fetch('http://localhost:3000/');process.exit(r.ok?0:1)}catch{process.exit(1)}}h()"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: always
    expose:
      - "5432"
    environment:
      POSTGRES_DB: cpmind
      POSTGRES_USER: cpmind
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cpmind"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backup:
    image: postgres:16-alpine
    restart: always
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./backup/crontab:/etc/crontabs/root:ro
    entrypoint: crond -f -l 2
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  media-worker:
    build:
      context: .
      dockerfile: packages/media-worker/Dockerfile
    restart: always
    stop_grace_period: 60s
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://cpmind:${DB_PASSWORD}@postgres:5432/cpmind
      YC_WORKER_KEY_ID: ${YC_WORKER_KEY_ID}
      YC_WORKER_SECRET: ${YC_WORKER_SECRET}
      STAGING_BUCKET: ${STAGING_BUCKET}
      SOURCE_BUCKET: ${SOURCE_BUCKET}
      DELIVERY_BUCKET: ${DELIVERY_BUCKET}
      CDN_BASE_URL: ${CDN_BASE_URL}
      BRIDGE_VERSION: ${BRIDGE_VERSION:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      WORKER_LEASE_MS: ${WORKER_LEASE_MS:-900000}
      WORKER_HEARTBEAT_MS: ${WORKER_HEARTBEAT_MS:-30000}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-5000}
      WORKER_TEMP_DIR: /tmp/cpmind-worker
      WORKER_DB_POOL_MAX: ${WORKER_DB_POOL_MAX:-5}
      WORKER_DB_IDLE_TIMEOUT_MS: ${WORKER_DB_IDLE_TIMEOUT_MS:-30000}
      WORKER_DB_CONNECTION_TIMEOUT_MS: ${WORKER_DB_CONNECTION_TIMEOUT_MS:-5000}
    tmpfs:
      - /tmp/cpmind-worker:size=10g,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  runtime-publisher:
    build:
      context: .
      dockerfile: packages/runtime-publisher/Dockerfile
      args:
        CDN_BASE_URL: ${CDN_BASE_URL}
        CDN_HOSTNAME: ${CDN_HOSTNAME}
        LOADER_RUNTIME_VERSION: ${LOADER_RUNTIME_VERSION:-1}
        DISPLAY_RUNTIME_VERSION: ${DISPLAY_RUNTIME_VERSION:-1}
        PLAYER_RUNTIME_VERSION: ${PLAYER_RUNTIME_VERSION:-1}
        BRIDGE_VERSION: ${BRIDGE_VERSION:-1}
    restart: "no"
    environment:
      NODE_ENV: production
      YC_WORKER_KEY_ID: ${YC_WORKER_KEY_ID}
      YC_WORKER_SECRET: ${YC_WORKER_SECRET}
      DELIVERY_BUCKET: ${DELIVERY_BUCKET}
      RUNTIME_PUBLISH_ALLOW_OVERWRITE: ${RUNTIME_PUBLISH_ALLOW_OVERWRITE:-false}
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  tag_dist: