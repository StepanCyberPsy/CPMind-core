services:

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - tag_dist:/etc/nginx/tag:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    restart: always
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://cpmind:${DB_PASSWORD}@postgres:5432/cpmind
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      ADMIN_LOGIN: ${ADMIN_LOGIN}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      CALIBRATION_DRAFT_TTL_MINUTES: ${CALIBRATION_DRAFT_TTL_MINUTES:-60}
      TAG_DIST_DIR: /tag_dist
      LOG_LEVEL: info
      PORT: "3001"
      HOST: "0.0.0.0"
    volumes:
      - tag_dist:/tag_dist
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "async function h(){try{const r=await fetch('http://localhost:3001/api/health');process.exit(r.ok?0:1)}catch{process.exit(1)}}h()"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ""
    restart: always
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:3001
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "async function h(){try{const r=await fetch('http://localhost:3000/');process.exit(r.ok?0:1)}catch{process.exit(1)}}h()"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: always
    expose:
      - "5432"
    environment:
      POSTGRES_DB: cpmind
      POSTGRES_USER: cpmind
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cpmind"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backup:
    image: postgres:16-alpine
    restart: always
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./backup/crontab:/etc/crontabs/root:ro
    entrypoint: crond -f -l 2
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  tag_dist: