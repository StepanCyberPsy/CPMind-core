worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 4096;
  multi_accept on;
  use epoll;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;

  # Защита от slow-client (Slowloris)
  client_body_timeout 12s;
  client_header_timeout 12s;
  send_timeout 10s;

  client_body_buffer_size 128k;
  client_header_buffer_size 1k;
  large_client_header_buffers 4 4k;

  # Docker internal DNS — обязателен для proxy_ssl_server_name
  resolver 127.0.0.11 valid=30s ipv6=off;
  resolver_timeout 5s;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/javascript application/javascript application/json application/xml text/xml text/css image/svg+xml;

  # Rate limiting
  limit_req_zone $binary_remote_addr zone=beacon:10m rate=100r/s;
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=delivery:10m rate=60r/s;
  limit_req_zone $binary_remote_addr zone=creative:10m rate=300r/s;
  limit_req_status 429;

  # Connection limiting — защита от connection flood
  limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
  limit_conn_status 429;

  # Cache-Control для creative.cpmind.tech — иммутабельный только для успешных ответов
  # Пустое значение add_header не добавляет: ошибки Object Storage не кешируются клиентами
  map $upstream_status $creative_cache_control {
    default "";
    200     "public, max-age=31536000, immutable";
    206     "public, max-age=31536000, immutable";
    304     "public, max-age=31536000, immutable";
  }

  # TLS — глобальные настройки
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  # ssl_stapling on;
  # ssl_stapling_verify on;

  # Неизвестные HTTP Host
  server {
    listen 80 default_server;
    server_name _;
    return 444;
  }

  # Неизвестные TLS SNI
  server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
  }

  # HTTP → HTTPS — единый redirect для всех доменов
  server {
    listen 80;
    server_name app.cpmind.tech delivery.cpmind.tech creative.cpmind.tech;
    return 301 https://$host$request_uri;
  }

  # app.cpmind.tech — панель управления
  server {
    listen 443 ssl;
    http2 on;
    server_name app.cpmind.tech;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 1m;
    limit_conn conn_per_ip 50;

    # Security headers — наследуются location-блоками без собственных add_header
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://cdn.cpmind.tech; media-src 'self' https://cdn.cpmind.tech; frame-src https://creative.cpmind.tech; connect-src 'self' https://cpmind-upload-staging.storage.yandexcloud.net; frame-ancestors 'none';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Beacon endpoint — публичный, rate limit beacon zone
    location = /api/collect {
      limit_req zone=beacon burst=200 nodelay;

      proxy_pass http://backend:3001;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 3s;
      proxy_read_timeout 5s;
    }

    # Upload session creation — JWT-protected, отдельный rate limit
    location = /api/creative-uploads {
      limit_req zone=api burst=10 nodelay;

      proxy_pass http://backend:3001;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Cookie $http_cookie;
      proxy_connect_timeout 3s;
      proxy_read_timeout 10s;
    }

    # Panel API — JWT-protected, buffering off для CSV streaming
    location /api/ {
      limit_req zone=api burst=60 nodelay;

      proxy_pass http://backend:3001;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Cookie $http_cookie;
      proxy_buffering off;
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
    }

    # Frontend — Next.js standalone
    location / {
      proxy_pass http://frontend:3000;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Cookie $http_cookie;
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
    }

    # Tag files — location с собственными add_header, security headers повторяются явно
    location /tag/ {
      alias /etc/nginx/tag/;

      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Cache-Control "public, max-age=3600";
    }
  }

  # delivery.cpmind.tech — embed scripts, VAST, tracking, delivery events
  server {
    listen 443 ssl;
    http2 on;
    server_name delivery.cpmind.tech;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 1m;
    limit_conn conn_per_ip 100;

    # Embed script — динамический JS, no-store обязателен
    # CORS не выставляется здесь: ACAO отдаёт @fastify/cors, дублирование ломает CORS-проверку
    location ~ ^/e/ {
      limit_req zone=delivery burst=30 nodelay;

      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Cache-Control "no-store" always;
      add_header Cross-Origin-Resource-Policy "cross-origin" always;

      proxy_pass http://backend:3001;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 3s;
      proxy_read_timeout 10s;
    }

    # Tracking pixels — fire-and-forget 204, высокий burst
    # Плеер вызывает их в режиме no-cors: CORP обязателен, ACAO отдаёт @fastify/cors
    location ~ ^/t/ {
      limit_req zone=delivery burst=120 nodelay;

      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Cache-Control "no-store" always;
      add_header Cross-Origin-Resource-Policy "cross-origin" always;

      proxy_pass http://backend:3001;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 3s;
      proxy_read_timeout 5s;
    }

    # VAST + /api/delivery/event + остальные delivery endpoints
    location / {
      limit_req zone=delivery burst=60 nodelay;

      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Cache-Control "no-store" always;

      proxy_pass http://backend:3001;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 3s;
      proxy_read_timeout 10s;
    }
  }

  # creative.cpmind.tech — изолированный origin для HTML5 креативов
  server {
    listen 443 ssl;
    http2 on;
    server_name creative.cpmind.tech;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 1m;
    limit_conn conn_per_ip 50;

    # Security headers — без X-Frame-Options (iframe обязателен)
    # CSP connect-src: none изолирует creative от исходящих соединений
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:; connect-src 'none'; frame-ancestors *;" always;

    # Блокировка path traversal — наследует server-level headers
    location ~ \.\. {
      return 400;
    }

    # Проксирование на Object Storage — контент-адресованные иммутабельные ассеты
    # Отдельная зона creative: HTML5-бандл раздаётся пофайлово, лимит delivery недостаточен
    location / {
      limit_req zone=creative burst=500 nodelay;

      # Security headers повторяются явно — location с add_header не наследует server-level
      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:; connect-src 'none'; frame-ancestors *;" always;
      add_header Cache-Control $creative_cache_control always;

      proxy_pass https://cpmind-delivery-assets.storage.yandexcloud.net;
      proxy_http_version 1.1;
      proxy_set_header Host cpmind-delivery-assets.storage.yandexcloud.net;
      proxy_set_header Connection "";
      proxy_ssl_server_name on;
      proxy_ssl_name cpmind-delivery-assets.storage.yandexcloud.net;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
      proxy_ssl_verify_depth 3;
      proxy_ssl_protocols TLSv1.2 TLSv1.3;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header Forwarded "";
      proxy_hide_header x-amz-request-id;
      proxy_hide_header x-amz-id-2;
      proxy_hide_header Set-Cookie;
      proxy_ignore_headers Set-Cookie;
      proxy_connect_timeout 5s;
      proxy_read_timeout 10s;
    }
  }
}